name: Direct publication V1 patch

on:
  push:
    branches:
      - feature/portal-customer-onboarding-v1

permissions:
  contents: write

jobs:
  patch-direct-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/portal-customer-onboarding-v1
          fetch-depth: 0

      - name: Apply focused cockpit patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/cockpit/[id]/BrokerWorkflowPanel.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''        : approvalDone ||
            publicationStarted
          ? "active"''',
              '''        : objectPackageReady ||
            approvalDone ||
            publicationStarted
          ? "active"''',
              "publication state",
          )

          replace_once(
              '''            Inserat-AI Makler-Workflow''',
              '''            Inserat-AI Automation''',
              "eyebrow",
          )

          replace_once(
              '''            Vom Kundentermin bis online''',
              '''            Direkt ver\u00f6ffentlichen \u2013 CRM optional''',
              "headline",
          )

          replace_once(
              '''            Ein Objekt, ein Datenpaket.
            Bewertung, Auftrag,
            Vermarktung und
            Ver&ouml;ffentlichung bauen
            direkt aufeinander auf.''',
              '''            Ein Objekt, ein Datenpaket. Sobald Objektdaten,
            Bilder und Inserattext bereit sind, kannst du direkt
            ver&ouml;ffentlichen. Bewertung und Auftrag bleiben als
            optionaler Makler-Workflow erhalten.''',
              "intro",
          )

          marker = '''      <div className="mt-5 overflow-hidden rounded-2xl border border-white/[0.08] bg-slate-950/35">'''
          direct_panel = '''      {objectPackageReady ? (
        <div
          id="direct-publication"
          className="mt-5 rounded-2xl border border-emerald-300/25 bg-emerald-300/[0.055] p-4 sm:p-5"
        >
          <p className="text-[10px] font-black uppercase tracking-[0.16em] text-emerald-300">
            Automation bereit
          </p>

          <h3 className="mt-2 text-lg font-black text-white">
            Direkt zur Ver&ouml;ffentlichung
          </h3>

          <p className="mt-2 max-w-3xl text-xs font-semibold leading-5 text-slate-300">
            Dein Objektpaket ist vollst&auml;ndig. Du musst f&uuml;r diesen Automationsweg
            weder Bewertung noch Auftrag als Pflichtschritt abschliessen.
          </p>

          <div className="mt-4">
            <PublicationOrchestratorPanel
              listingId={listingId}
              market={market}
              onPublicationStateChange={handlePublicationStateChange}
            />
          </div>
        </div>
      ) : (
        <div className="mt-5 rounded-2xl border border-amber-300/20 bg-amber-300/[0.045] px-4 py-3">
          <p className="text-xs font-black text-amber-100">
            Direkte Ver&ouml;ffentlichung wird freigeschaltet, sobald Objektdaten,
            Bilder und Inserattext komplett sind ({readyCount}/3).
          </p>
        </div>
      )}

''' + marker
          replace_once(marker, direct_panel, "direct publication panel")

          replace_once(
              '''            Freigabe
          </h3>''',
              '''            Freigabe (optional)
          </h3>''',
              "optional approval title",
          )

          old_publication_gate = '''          {approvalDone ? (
            <PublicationOrchestratorPanel
              listingId={
                listingId
              }
              market={
                market
              }
              onPublicationStateChange={
                handlePublicationStateChange
              }
            />
          ) : (
            <div className="mt-4 rounded-xl border border-white/[0.07] bg-white/[0.025] px-3 py-2 text-center text-[11px] font-bold text-slate-500">
              Nach Vermarktungsfreigabe verf&uuml;gbar
            </div>
          )}'''
          new_publication_gate = '''          <div className="mt-4 rounded-xl border border-white/[0.07] bg-white/[0.025] px-3 py-2 text-center text-[11px] font-bold text-slate-400">
            {objectPackageReady
              ? "Direktver&ouml;ffentlichung ist oben bereit."
              : "Sobald Objektdaten, Bilder und Inserattext bereit sind."}
          </div>'''
          replace_once(old_publication_gate, new_publication_gate, "legacy publication gate")

          replace_once(
              '''          Ziel: Beim Kunden aufnehmen,
          bewerten, Auftrag erhalten,
          Paket automatisch erstellen,
          freigeben und noch aus dem
          Auto ver&ouml;ffentlichen.''',
              '''          Ziel: Objekt aufnehmen, Inserat-AI automatisieren lassen,
          kurz kontrollieren und direkt ver&ouml;ffentlichen. Bewertung, Auftrag
          und CRM-Schritte bleiben bei Bedarf separat verf&uuml;gbar.''',
              "footer goal",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/direct-publication-v1.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "inserat-ai-automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/cockpit/[id]/BrokerWorkflowPanel.tsx .github/workflows/direct-publication-v1.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add direct publication path"
          git push origin HEAD:feature/portal-customer-onboarding-v1
